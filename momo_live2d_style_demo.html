olor:#d34b9b}.note{font-size:12px;line-height:1.5;max-width:470px;margin:8px auto;color:#684d72}button{border:0;border-radius:20px;padding:12px 22px;background:#db4da0;color:white;font-weight:700;font-size:15px}@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.012)}}@keyframes hairR{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2deg) translateX(3px)}}@keyframes hairL{0%,100%{transform:rotate(1deg)}50%{transform:rotate(-2.3deg) translateX(-3px)}}@keyframes ear{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}}@keyframes hop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-20px) scale(1.035)}70%{transform:translateY(0) scale(.99)}}@keyframes float{0%{transform:translate(-50%,-10%) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-145px) scale(1.4) rotate(15deg);opacity:0}}.off{animation:none!important}</style></head><body><main class="app"><h1>💗 もも♡ モーション試作</h1><p>ももをタップしてみてね！</p><div class="stage" id="stage"><div class="actor" id="actor"><div class="piece base"></div><div class="piece hairR" data-motion="hair"></div><div class="piece hairL" data-motion="hair"></div><div class="piece earR" data-motion="ears"></div><div class="piece earL" data-motion="ears"></div></div><div class="tag" id="message">もも「……なあに？♡」</div></div><div class="controls"><label><input type="checkbox" data-toggle="breathe" checked> 呼吸・ゆらゆら</label><label><input type="checkbox" data-toggle="hair" checked> 髪の揺れ</label><label><input type="checkbox" data-toggle="ears" checked> うさ耳の揺れ</label><label><input type="checkbox" data-toggle="reaction" checked> タップ反応</label></div><button id="react">💕 ももにタッチ</button><p class="note">これは1枚絵を使ったLive2D風の試作です。髪や耳は画像の一部を重ねて動かしているため、境界にズレが見えることがあります。本格的なまばたき・顔の回転にはパーツ分け画像が必要です。</p></main><script>document.documentElement.style.setProperty('--pic','url(data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QCMRXhpZgAATU0AKgAAAAgABQESAAMAAAABAAEAAAEaAAUAAAABAAAASgEbAAUAAAABAAAAUgE
